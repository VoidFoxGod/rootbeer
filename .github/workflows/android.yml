name: Build RootBeer Sample APK

on:
  # 允许在 Actions 页面手动点击按钮触发构建
  workflow_dispatch:
  # 当你创建或修改此文件推送到 master 分支时，也会自动触发构建
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库源码
        uses: actions/checkout@v4

      - name: 2. 配置 JDK 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. 赋予 gradlew 执行权限并编译 Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug

      - name: 4. 上传生成的 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: RootBeer-Sample-v0.1.2-APK
          path: app/build/outputs/apk/debug/*.apk
